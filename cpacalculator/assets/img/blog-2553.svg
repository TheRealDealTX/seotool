<text x="72" y="276" fill="#fff" font-size="62" font-weight="800"><tspan fill="#10b981">elect S corp</tspan></text>
<text x="72" y="340" fill="#94a3b8" font-size="26" font-weight="500">Eligibility, deadline, late relief</text>
